# GhostVidStream Alpine Pi appliance — SSH policy (key-only if enabled)
# SSH is disabled by default via OpenRC (rc-update del sshd).
# To enable: install an authorized_keys for a user, then:
#   rc-update add sshd default && rc-service sshd start

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PubkeyAuthentication yes
X11Forwarding no
AllowTcpForwarding no
PermitEmptyPasswords no
UseDNS no
MaxAuthTries 3
LoginGraceTime 30
Subsystem sftp /usr/lib/ssh/sftp-server
